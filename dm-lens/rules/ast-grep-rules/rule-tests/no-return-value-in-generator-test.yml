id: no-return-value-in-generator
valid:
  - |
    def gen():
        yield 1
        yield 2
  - |
    def gen():
        yield 1
        return  # bare return is OK
  - |
    def regular():
        return 42
  - |
    @asynccontextmanager
    async def lifespan(app):
        def handler():
            return 42
        yield
  - |
    # #4840: the yield belongs to the lambda, not to make().
    def make():
        f = lambda: (yield)
        return f
  - |
    # #1806 shape: the only yield is in a nested def; return 2 is not a generator return.
    def outer():
        def inner():
            yield 1
        return 2
invalid:
  - |
    def gen():
        yield 1
        return 42
  - |
    def gen():
        yield from iter([1, 2])
        return result
  - |
    def outer():
        def inner_gen():
            yield 1
            return 99
        return inner_gen
  - |
    # #4840: a lambda elsewhere in a real generator does not hide its yield.
    def gen():
        key = lambda x: x
        yield key(1)
        return 2
